plugins {
    id 'com.android.application'
}

android {
    namespace 'com.snoworno.app'
    compileSdk 35

    defaultConfig {
        applicationId 'com.snoworno.app'
        minSdk 26
        targetSdk 35
        versionCode 12
        versionName '0.9.1'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
